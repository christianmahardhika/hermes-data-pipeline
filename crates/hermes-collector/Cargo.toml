[package]
name = "hermes-collector"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared Hermes common library
hermes-common = { path = "../hermes-common" }

# Async runtime and utilities
tokio = { workspace = true }
futures = { workspace = true }

# Error handling  
anyhow = { workspace = true }
