# RSS parsing
rss = "2.0"

# Logging
tracing = { workspace = true }

# Time handling
chrono = { workspace = true }

# Async utilities
async-trait = { workspace = true }

# UUID generation
uuid = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"