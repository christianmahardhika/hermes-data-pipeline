[package]
name = "hermes-collector"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared Hermes common library
hermes-common = { path = "../hermes-common" }

# News intelligence for storage + processing
news-intelligence = { path = "../news-intelligence" }

# Async runtime and utilities
tokio = { workspace = true }
futures = { workspace = true }

# Error handling  
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# RSS parsing
rss = "2.0"

# HTTP client for real fetch
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = "0.3"

# Time handling
chrono = { workspace = true }

# Async utilities
async-trait = { workspace = true }

# UUID generation
uuid = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"