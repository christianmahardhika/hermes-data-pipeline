[package]
name = "news-intelligence"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# Text processing
regex = "1.0"
unicode-segmentation = "1.10"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Indonesian text processing
whatlang = "0.16"

# JSON handling
serde_json = "1.0"

# Hash maps
hashbrown = "0.14"

# Math operations
num-traits = "0.2"