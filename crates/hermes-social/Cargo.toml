[package]
name = "hermes-social"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared Hermes common library
hermes-common = { path = "../hermes-common" }

# Async runtime and utilities
tokio = { workspace = true }
futures = { workspace = true }
async-trait = "0.1"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"

# Logging and tracing
tracing = { workspace = true }

# Time handling
chrono = { workspace = true, features = ["serde"] }

# UUID generation
uuid = { workspace = true, features = ["serde", "v4"] }

# HTTP client for API calls (trait-based for testing)
# reqwest = { version = "0.11", features = ["json", "stream"] }

# XML parsing for RSS/Atom feeds
quick-xml = "0.31"
feed-rs = "1.3"

# HTML processing
scraper = "0.18"
html2text = "0.12"

# Text processing
regex = "1.10"
unicode-normalization = "0.1"

# Command line interface
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"