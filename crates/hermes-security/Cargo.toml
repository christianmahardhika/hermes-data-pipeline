[package]
name = "hermes-security"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared Hermes libraries
hermes-common = { path = "../hermes-common" }

# Security dependencies
jsonwebtoken = "9.3"
bcrypt = "0.15"
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"

# Rate limiting and security
governor = "0.6"
ring = "0.17"
rustls = "0.23"
webpki = "0.22"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async HTTP client for certificate checks
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# IP validation and geolocation
ipnet = "2.9"
maxminddb = "0.24"

# Vulnerability scanning
regex = "1.10"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"