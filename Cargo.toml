[workspace]
resolver = "2"
members = [
    "crates/hermes-common",
    "crates/hermes-collector",
    "crates/hermes-processor", "crates/hermes-social", "crates/hermes-economic", "crates/hermes-analyst",
    "crates/news-intelligence",
]
exclude = ["news-social-intelligence-data-pipeline", "legacy/*"]

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

# HTTP and networking
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"

# ArangoDB client
arangors = "0.5"

# Redis for agent coordination  
redis = { version = "0.23", features = ["tokio-comp", "streams"] }

# HTTP server for hermes-analyst API
axum = "0.7"
tower = "0.4"

# Feed parsing for hermes-collector
feed-rs = "1.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.13"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
prometheus = "0.13"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

[workspace.package]
edition = "2021"
rust-version = "1.70"

# TASK 42: Performance Optimization Profiles
[profile.release]
# Maximum performance optimization for Indonesian intelligence pipeline production
opt-level = 3              # Maximum optimization level
debug = false              # No debug info for production
strip = true              # Strip symbols for smaller binaries  
lto = true                # Link-time optimization for better performance
codegen-units = 1         # Single codegen unit for maximum optimization
panic = "abort"           # Abort on panic for smaller binaries
overflow-checks = false   # Disable overflow checks in release

[profile.release-with-debug]
# Production build with minimal debug for troubleshooting Prof Jiang analysis
inherits = "release"
debug = 1                 # Line tables only
strip = "debuginfo"       # Keep symbols for stack traces

[profile.bench]
# Benchmarking profile for Indonesian market performance testing
inherits = "release"
debug = true              # Keep debug info for profiling tools
lto = false              # Disable LTO for faster benchmark compilation
