[workspace]
resolver = "2"
members = [
    "crates/hermes-common"
    # Note: More crates will be added incrementally during TDD implementation
    # "crates/hermes-collector", 
    # "crates/hermes-processor",
    # "crates/hermes-social",
    # "crates/hermes-economic",
    # "crates/hermes-analyst"
]

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

# HTTP and networking
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"

# ArangoDB client
arangors = "0.5"

# Redis for agent coordination  
redis = { version = "0.23", features = ["tokio-comp", "streams"] }

# HTTP server for hermes-analyst API
axum = "0.7"
tower = "0.4"

# Feed parsing for hermes-collector
feed-rs = "1.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.13"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
prometheus = "0.13"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }