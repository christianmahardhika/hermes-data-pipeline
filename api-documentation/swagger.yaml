openapi: 3.0.3
info:
  title: Intelligence System Rust Backend API
  description: |
    Comprehensive Intelligence System Backend for Indonesian Financial Markets
    
    Features:
    - Real-time Indonesian stock portfolio management (BMRI, BBRI, INCO, ANTM)
    - Strategic commodity data collection (Nickel, Gold, Coal, Palm Oil, Crude Oil)
    - Prof Jiang Geopolitical Analysis with Game Theory models
    - News correlation analysis with Indonesian/English bilingual support
    - LSTM-based stock price predictions
    - Real-time system performance monitoring
    
    **Technology Stack**: Rust + Tokio + Serde + TimescaleDB
    **Target Audience**: Indonesian institutional investors and portfolio managers
    **Data Sources**: Yahoo Finance, Indonesian financial news, geopolitical analysis
  version: "1.0.0"
  contact:
    name: Christian Mahardhika
    url: https://github.com/christianmahardhika/hermes-data-pipeline
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8888
    description: Local Development Server
  - url: https://api.intelligence.local:8888
    description: Production Server (when deployed)

paths:
  /health:
    get:
      tags:
        - System Health
      summary: Health Check Endpoint
      description: |
        Returns system health status, version, and uptime information.
        Used for monitoring and load balancer health checks.
      operationId: getHealth
      responses:
        '200':
          description: System is healthy and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                service: "Intelligence System Rust Backend"
                status: "healthy"
                timestamp: "2026-07-30T23:44:58.839122212+00:00"
                version: "1.0.0"
        '503':
          description: System is unhealthy or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/dashboard:
    get:
      tags:
        - Dashboard Data
      summary: Get Complete Dashboard Data
      description: |
        Returns comprehensive dashboard data including:
        - Indonesian stock portfolio performance (BMRI, BBRI, INCO, ANTM)
        - Strategic commodity prices (Nickel, Gold, Coal, Palm Oil, Crude Oil)
        - Prof Jiang geopolitical analysis with Game Theory models
        - News correlations with sentiment analysis
        - LSTM stock price predictions
        - System performance metrics
        - Real-time alerts and notifications
        
        **Performance**: Typical response time < 50ms with 85% cache hit ratio
        **Update Frequency**: Real-time with 30-second polling intervals
      operationId: getDashboardData
