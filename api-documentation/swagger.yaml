components:
  schemas:
    HealthResponse:
      type: object
      required:
        - service
        - status
        - timestamp
        - version
      properties:
        service:
          type: string
          description: Service name identifier
          example: "Intelligence System Rust Backend"
        status:
          type: string
          enum: ["healthy", "degraded", "unhealthy"]
          description: Current system health status
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of health check
          example: "2026-07-30T23:44:58.839122212+00:00"
        version:
          type: string
          description: API version
          example: "1.0.0"

    DashboardResponse:
      type: object
      required:
        - portfolioData
        - stockData
        - commodityData
        - geopoliticalSignals
        - newsCorrelations
        - correlationData
        - predictions
        - alerts
        - performance
      properties:
        portfolioData:
          $ref: '#/components/schemas/PortfolioData'
        stockData:
          type: array
          items:
            $ref: '#/components/schemas/StockData'
        commodityData:
          type: array
          items:
            $ref: '#/components/schemas/CommodityData'
        geopoliticalSignals:
          type: array
          items:
            $ref: '#/components/schemas/GeopoliticalSignal'
        newsCorrelations:
          type: array
          items:
            $ref: '#/components/schemas/NewsCorrelation'
        correlationData:
          type: array
          items:
            $ref: '#/components/schemas/CorrelationData'
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/Prediction'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        performance:
          $ref: '#/components/schemas/Performance'

    PortfolioData:
      type: object
      required:
        - portfolioValue
        - totalGain
        - gainPercentage
        - holdings
      properties:
        portfolioValue:
          type: number
          format: double
          description: Total portfolio value in Indonesian Rupiah
          example: 12584367.58776372
        totalGain:
          type: number
          format: double
          description: Total unrealized gain/loss
          example: 25324.41756023461
        gainPercentage:
          type: number
          format: double
          description: Percentage gain/loss (0.20 = 20%)
          example: 0.20164288964558355
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/Holding'

    Holding:
      type: object
      required:
        - symbol
        - shares
        - value
        - change
      properties:
        symbol:
          type: string
          description: Stock symbol (Indonesian stock codes)
          enum: ["BMRI", "BBRI", "INCO", "ANTM"]
          example: "BMRI"
        shares:
          type: number
          format: double
          description: Number of shares owned
          example: 1000.0
        value:
          type: number
          format: double
          description: Current market value of holdings
          example: 4808014.630870463
        change:
          type: number
          format: double
          description: Unrealized gain/loss for this holding
          example: 8028.01301796045

    StockData:
      type: object
      required:
        - symbol
        - price
        - change_percent
        - volume
        - timestamp
      properties:
        symbol:
          type: string
          description: Stock symbol
          enum: ["BMRI", "BBRI", "INCO", "ANTM"]
          example: "BMRI"
        price:
          type: number
          format: double
          description: Current stock price in Indonesian Rupiah
          example: 4808.014630870463
        change_percent:
          type: number
          format: double
          description: Daily percentage change
          example: 0.16697147646797042
        volume:
          type: integer
          description: Trading volume
          example: 12907281
        timestamp:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2026-07-30T17:38:01.657241313+00:00"

    CommodityData:
      type: object
      required:
        - commodity
        - price
        - change
        - currency
        - unit
        - timestamp
      properties:
        commodity:
          type: string
          description: Commodity name
          enum: ["Nickel", "Gold", "Crude Oil", "Thermal Coal", "Palm Oil"]
          example: "Nickel"
        price:
          type: number
          format: double
          description: Current commodity price
          example: 18450.0
        change:
          type: number
          format: double
          description: Daily price change
          example: 245.0
        currency:
          type: string
          description: Price currency
          enum: ["USD"]
          example: "USD"
        unit:
          type: string
          description: Price unit
          enum: ["per tonne", "per oz", "per barrel", "per metric ton"]
          example: "per tonne"
        timestamp:
          type: string
          format: date-time
          description: Data timestamp
          example: "2026-07-30T23:45:07.486092337Z"

    GeopoliticalSignal:
      type: object
      required:
        - region
        - signal
        - impact
        - confidence
        - elite_overproduction_score
        - game_theory_analysis
        - timestamp
      properties:
        region:
          type: string
          description: Geographical region
          enum: ["Indonesia", "Southeast Asia", "Global"]
          example: "Indonesia"
        signal:
          type: string
          description: Geopolitical signal description
          example: "Indonesia-China bilateral trade agreement shows positive momentum"
        impact:
          type: string
          description: Expected impact level
          enum: ["low", "medium", "high"]
          example: "high"
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confidence score (0-1)
          example: 0.82
        elite_overproduction_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Prof Jiang elite overproduction score (0-1)
          example: 0.65
        game_theory_analysis:
          $ref: '#/components/schemas/GameTheoryAnalysis'
        timestamp:
          type: string
          format: date-time
          description: Signal timestamp
          example: "2026-07-30T23:45:07.360794965Z"

    GameTheoryAnalysis:
      type: object
      required:
        - cooperation_probability
        - defection_risk
        - nash_equilibrium
      properties:
        cooperation_probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Probability of cooperative behavior (0-1)
          example: 0.78
        defection_risk:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Risk of defection from agreements (0-1)
          example: 0.22
        nash_equilibrium:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Nash equilibrium stability score (0-1)
          example: 0.85

    NewsCorrelation:
      type: object
      required:
        - title
        - source
        - sentiment
        - impact
        - language
        - timestamp
      properties:
        title:
          type: string
          description: News article title
          example: "Bank Mandiri (BMRI) mencatat pertumbuhan laba bersih 15% di kuartal ketiga"
        source:
          type: string
          description: News source
          enum: ["Kompas", "Bisnis Indonesia", "Reuters", "CNN Indonesia", "Detik Finance", "Tempo"]
          example: "Kompas"
        sentiment:
          type: number
          format: double
          minimum: -1
          maximum: 1
          description: Sentiment score (-1 to 1, negative to positive)
          example: 0.0
        impact:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Market impact score (0-1)
          example: 0.5
        language:
          type: string
          description: Article language
          enum: ["id", "en"]
          example: "en"
        timestamp:
          type: string
          format: date-time
          description: News timestamp
          example: "2026-07-30T23:45:07.584473573Z"

    CorrelationData:
      type: object
      required:
        - pair
        - correlation
        - strength
        - timeframe
      properties:
        pair:
          type: string
          description: Stock pair for correlation analysis
          example: "BMRI-BBRI"
        correlation:
          type: number
          format: double
          minimum: -1
          maximum: 1
          description: Correlation coefficient (-1 to 1)
          example: 0.85
        strength:
          type: string
          description: Correlation strength category
          enum: ["Weak", "Moderate", "Strong"]
          example: "Strong"
        timeframe:
          type: string
          description: Analysis timeframe
          enum: ["1D", "7D", "30D", "90D", "1Y"]
          example: "30D"

    Prediction:
      type: object
      required:
        - symbol
        - prediction
        - confidence
        - timeframe
        - model
      properties:
        symbol:
          type: string
          description: Stock symbol
          enum: ["BMRI", "BBRI", "INCO", "ANTM"]
          example: "BMRI"
        prediction:
          type: number
          format: double
          description: Predicted price
          example: 4950.0
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Prediction confidence (0-1)
          example: 0.72
        timeframe:
          type: string
          description: Prediction timeframe
          enum: ["1D", "1W", "1M", "3M"]
          example: "1W"
        model:
          type: string
          description: ML model used for prediction
          enum: ["LSTM", "GRU", "Random Forest", "XGBoost"]
          example: "LSTM"

    Alert:
      type: object
      required:
        - category
        - message
        - severity
        - timestamp
      properties:
        category:
          type: string
          description: Alert category
          enum: ["volume", "price", "commodities", "sentiment", "technical", "fundamental"]
          example: "volume"
        message:
          type: string
          description: Alert message
          example: "BMRI stock showing unusual volume spike (+150%)"
        severity:
          type: string
          description: Alert severity level
          enum: ["low", "medium", "high", "critical"]
          example: "high"
        timestamp:
          type: string
          format: date-time
          description: Alert timestamp
          example: "2026-07-30T23:45:07.586608091Z"

    Performance:
      type: object
      required:
        - response_time_ms
        - cpu_usage_percent
        - memory_usage_mb
        - cache_hit_ratio
      properties:
        response_time_ms:
          type: number
          format: double
          description: API response time in milliseconds
          example: 15.2
        cpu_usage_percent:
          type: number
          format: double
          description: CPU usage percentage
          example: 12.3
        memory_usage_mb:
          type: number
          format: double
          description: Memory usage in megabytes
          example: 128.5
        cache_hit_ratio:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Cache hit ratio (0-1)
          example: 0.85

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Error code or type
          example: "INTERNAL_SERVER_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "An internal server error occurred"
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2026-07-30T23:45:07.586616010Z"
        details:
          type: object
          description: Additional error details
          additionalProperties: true

tags:
  - name: System Health
    description: System health monitoring and status checks
  - name: Dashboard Data
    description: Complete dashboard data for Indonesian financial markets

externalDocs:
  description: GitHub Repository
  url: https://github.com/christianmahardhika/hermes-data-pipeline