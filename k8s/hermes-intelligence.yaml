apiVersion: v1
kind: Service
metadata:
  name: hermes-collector
  namespace: hermes-intelligence
  labels:
    app.kubernetes.io/name: hermes-collector
spec:
  selector:
    app.kubernetes.io/name: hermes-collector
  ports:
  - port: 8881
    targetPort: 8881
    name: http
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: hermes-processor
  namespace: hermes-intelligence
  labels:
    app.kubernetes.io/name: hermes-processor
