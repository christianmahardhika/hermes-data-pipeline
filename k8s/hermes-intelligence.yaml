---
# Load Balancer for External Access to Indonesian Intelligence Pipeline
apiVersion: v1
kind: Service
metadata:
  name: hermes-intelligence-lb
  namespace: hermes-intelligence
  labels:
    app.kubernetes.io/name: hermes-intelligence
    app.kubernetes.io/component: load-balancer
spec:
  selector:
    app.kubernetes.io/name: hermes-analyst  # Main API gateway
  ports:
  - port: 80
    targetPort: 8885
    name: http
  - port: 443
    targetPort: 8885
    name: https
  type: LoadBalancer
  loadBalancerSourceRanges:
  # Indonesian IP ranges for enhanced security
  - "202.150.0.0/16"    # Indonesian ISP ranges
  - "203.142.0.0/16"    # IDX and banking infrastructure
  
---
# Ingress for Indonesian Intelligence Pipeline
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-intelligence-ingress
  namespace: hermes-intelligence
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "300"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # Indonesian market specific annotations
    nginx.ingress.kubernetes.io/whitelist-source-range: "202.150.0.0/16,203.142.0.0/16"
spec:
  tls:
  - hosts:
    - hermes-intelligence.indonesian-market.local
    secretName: hermes-intelligence-tls
  rules:
  - host: hermes-intelligence.indonesian-market.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-analyst
            port:
              number: 8885
      - path: /api/collector
        pathType: Prefix
        backend:
          service:
            name: hermes-collector
            port:
              number: 8881
      - path: /api/processor
        pathType: Prefix
        backend:
          service:
            name: hermes-processor
            port:
              number: 8882
      - path: /api/social
        pathType: Prefix
        backend:
          service:
            name: hermes-social
            port:
              number: 8883
      - path: /api/economic
        pathType: Prefix
        backend:
          service:
            name: hermes-economic
            port:
              number: 8884

---
# Horizontal Pod Autoscaler for Dynamic Scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hermes-processor-hpa
  namespace: hermes-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hermes-processor
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Network Policy for Indonesian Intelligence Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-intelligence-network-policy
  namespace: hermes-intelligence
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: hermes-intelligence
    - podSelector: {}
  - from: []
    ports:
    - protocol: TCP
      port: 8881  # collector
    - protocol: TCP
      port: 8882  # processor
    - protocol: TCP
      port: 8883  # social
    - protocol: TCP
      port: 8884  # economic
    - protocol: TCP
      port: 8885  # analyst
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 8529  # ArangoDB
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 443   # HTTPS outbound for Indonesian market data
    - protocol: TCP
      port: 53    # DNS
    - protocol: UDP
      port: 53    # DNS