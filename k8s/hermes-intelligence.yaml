# Hermes Intelligence Pipeline - Kubernetes Production Deployment
# Task 43: Production Deployment Configuration
# Complete Kubernetes manifests for Indonesian intelligence pipeline

apiVersion: v1
kind: Namespace
metadata:
  name: hermes-intelligence
  labels:
    app.kubernetes.io/name: hermes-intelligence
    app.kubernetes.io/component: namespace

---
# ConfigMap for Indonesian Intelligence Pipeline Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes-intelligence
data:
  # Indonesian Market Configuration
  INDONESIAN_STOCKS: "BMRI,BBRI,INCO,ANTM,PTBA,TAPG"
  PROF_JIANG_ENABLED: "true"
  GEOPOLITICAL_ANALYSIS: "true"
  
  # Database Configuration
  ARANGO_DATABASE: "hermes"
  ARANGO_USERNAME: "hermes"
  
  # Performance Configuration
  TOKIO_WORKER_THREADS: "4"
  MAX_CONNECTIONS: "100"
  RUST_LOG: "info"
  
  # Service Discovery
  HERMES_COLLECTOR_URL: "http://hermes-collector:8881"
  HERMES_PROCESSOR_URL: "http://hermes-processor:8882"
  HERMES_SOCIAL_URL: "http://hermes-social:8883"
  HERMES_ECONOMIC_URL: "http://hermes-economic:8884"
  HERMES_ANALYST_URL: "http://hermes-analyst:8885"

---
# Secrets for Production Deployment
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes-intelligence
type: Opaque
data:
  # Base64 encoded secrets (replace with actual values)
  jwt-secret: aGVybWVzLWludGVsbGlnZW5jZS1qd3Qtc2VjcmV0LWtleQ==
  arango-password: aGVybWVzLWFyYW5nb2RiLXBhc3N3b3Jk
  redis-password: aGVybWVzLXJlZGlzLXBhc3N3b3Jk

---
# Hermes Collector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-collector
  namespace: hermes-intelligence
  labels:
    app.kubernetes.io/name: hermes-collector
    app.kubernetes.io/component: collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-collector
    spec:
      containers:
      - name: hermes-collector
        image: hermes-intelligence:latest
        command: ["/app/bin/hermes-collector"]
        ports:
        - containerPort: 8881
        envFrom:
        - configMapRef:
            name: hermes-config
        env:
        - name: ARANGO_URL
          value: "arangodb://arangodb:8529"
        - name: ARANGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: arango-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8881
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8881
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Hermes Processor Deployment  
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-processor
  namespace: hermes-intelligence
  labels:
    app.kubernetes.io/name: hermes-processor
    app.kubernetes.io/component: processor
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-processor
    spec:
      containers:
      - name: hermes-processor
        image: hermes-intelligence:latest
        command: ["/app/bin/hermes-processor"]
        ports:
        - containerPort: 8882
        envFrom:
        - configMapRef:
            name: hermes-config
        env:
        - name: ARANGO_URL
          value: "arangodb://arangodb:8529"
        - name: ARANGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: arango-password
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8882
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8882
          initialDelaySeconds: 5
          periodSeconds: 5

